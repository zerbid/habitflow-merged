<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HabitFlow — Comfort Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ECE5D5; height: 100%; }
  body { font-family: 'DM Sans', -apple-system, system-ui, sans-serif; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-mascot-growth.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function App() {
    const note = (txt) => ({
      fontFamily: '"Instrument Serif", Georgia, serif',
      fontSize: 13, color: '#5C544A', lineHeight: 1.45,
    });

    const frame = (Comp, props = {}) => (
      <IOSDevice width={402} height={874}>
        <Comp {...props} />
      </IOSDevice>
    );

    return (
      <DesignCanvas>
        {/* ───────────── Intro / Reasoning ───────────── */}
        <DCSection id="intro" title="HabitFlow · Comfort Redesign" subtitle="Warm Linen — soft, unhurried, less gamified">
          <DCArtboard id="reasoning" label="Design notes" width={520} height={874}>
            <div style={{
              padding: '40px 36px', background: '#FBF7EF',
              fontFamily: '"DM Sans", system-ui, sans-serif',
              color: '#2A2520', height: '100%', boxSizing: 'border-box',
              borderRadius: 16, border: '1px solid #E3DAC7',
              overflow: 'auto',
            }}>
              <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: '#9A8F80' }}>
                Direction
              </div>
              <div style={{
                fontFamily: '"Instrument Serif", Georgia, serif',
                fontSize: 40, lineHeight: 1.05, letterSpacing: -1, marginTop: 6,
              }}>
                A habit tracker that<br/>
                <span style={{ fontStyle: 'italic', color: '#5F7A60' }}>feels like a deep breath.</span>
              </div>

              <div style={{ marginTop: 22, fontSize: 14, lineHeight: 1.6, color: '#5C544A' }}>
                The current app uses indigo/purple gradients, big <strong>XP</strong> bars, fire emoji
                streaks and gamified language. None of that asks how you're doing —
                it pushes for output. This redesign trades that vocabulary for something
                quieter, on the assumption that comfort comes from a soft surface,
                generous breathing room, and copy that doesn't shame.
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, marginTop: 24 }}>
                <div>
                  <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase', color: '#9A8F80', marginBottom: 6 }}>Type</div>
                  <div style={{ fontFamily: '"Instrument Serif"', fontSize: 22 }}>Instrument Serif</div>
                  <div style={{ fontSize: 13, color: '#5C544A' }}>+ DM Sans for UI body</div>
                </div>
                <div>
                  <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase', color: '#9A8F80', marginBottom: 6 }}>Tone</div>
                  <div style={{ fontSize: 13, color: '#5C544A', lineHeight: 1.45 }}>
                    "23 günlük akış" instead of "🔥 23 day streak."
                  </div>
                </div>
              </div>

              <div style={{ marginTop: 22 }}>
                <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase', color: '#9A8F80', marginBottom: 10 }}>Palette · Warm Linen</div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  {[
                    ['#F2EDE3', 'oat'],
                    ['#FBF7EF', 'cream'],
                    ['#2A2520', 'ink'],
                    ['#5F7A60', 'sage'],
                    ['#B36B4E', 'clay'],
                  ].map(([c, l]) => (
                    <div key={c} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
                      <div style={{ width: 44, height: 44, borderRadius: 12, background: c, border: '1px solid #E3DAC7' }}/>
                      <span style={{ fontSize: 10, color: '#9A8F80' }}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ marginTop: 22 }}>
                <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase', color: '#9A8F80', marginBottom: 10 }}>Habit dots (muted earth)</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  {['#C97064','#D89465','#C9A961','#7A9B6A','#7BA5A8','#7B85A8','#9784A5','#B58198'].map(c => (
                    <div key={c} style={{ width: 28, height: 28, borderRadius: 9, background: c }}/>
                  ))}
                </div>
              </div>

              <div style={{ marginTop: 26, paddingTop: 18, borderTop: '1px solid #E3DAC7' }}>
                <div style={{ fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase', color: '#9A8F80', marginBottom: 8 }}>Comfort moves</div>
                <ul style={{ fontSize: 13, color: '#5C544A', lineHeight: 1.7, paddingLeft: 18, margin: 0 }}>
                  <li>Hero ring is small + serif numerals — informative, not loud.</li>
                  <li>Time groups read like <em>"Sabah · 06:00 — 11:00"</em>, not "☀️ SABAH RUTİNİ".</li>
                  <li>Habit rows: small circle progress + 1px hairline. No left accent bar.</li>
                  <li>FAB removed; an inline dashed "add" prompt invites instead of demands.</li>
                  <li>Stats screen carries a <em>reflection</em> card — your past words back to you.</li>
                  <li>Tab bar uses outlined glyphs, no emoji.</li>
                </ul>
              </div>
            </div>
          </DCArtboard>
        </DCSection>

        {/* ───────────── Growth mascots ───────────── */}
        <DCSection id="growth" title="Growth mascots · Bitki & Ateş" subtitle="Two companions that grow with consistent practice — see motion + stage spec">
          <DCArtboard id="growth-spec" label="System · 6 stages · motion spec" width={680} height={1020}>
            <GrowthSpec />
          </DCArtboard>
          <DCArtboard id="growth-picker" label="Picker · choose a companion" width={420} height={894}>
            {frame(MascotPicker)}
          </DCArtboard>
          <DCArtboard id="growth-plant" label="Today · Plant (Yetişmiş)" width={420} height={894}>
            {frame(DashboardPlant, { stage: 3 })}
          </DCArtboard>
          <DCArtboard id="growth-fire" label="Today · Campfire (Şenlik)" width={420} height={894}>
            {frame(DashboardFire, { stage: 3 })}
          </DCArtboard>
          <DCArtboard id="growth-plant-flower" label="Today · Plant (Çiçeklenme)" width={420} height={894}>
            {frame(DashboardPlant, { stage: 4 })}
          </DCArtboard>
          <DCArtboard id="growth-fire-roaring" label="Today · Campfire (Coşkulu)" width={420} height={894}>
            {frame(DashboardFire, { stage: 4 })}
          </DCArtboard>
          <DCArtboard id="growth-plant-wilted" label="Today · Plant (Solgun)" width={420} height={894}>
            {frame(DashboardPlant, { stage: -1 })}
          </DCArtboard>
          <DCArtboard id="growth-fire-embers" label="Today · Campfire (Köz)" width={420} height={894}>
            {frame(DashboardFire, { stage: -1 })}
          </DCArtboard>
        </DCSection>

        {/* ───────────── Main flow ───────────── */}
        <DCSection id="flow" title="Main flow" subtitle="Warm Linen across the core screens">
          <DCArtboard id="welcome" label="01 · Welcome" width={420} height={894}>
            {frame(Welcome)}
          </DCArtboard>
          <DCArtboard id="dashboard" label="02 · Today" width={420} height={894}>
            {frame(Dashboard)}
          </DCArtboard>
          <DCArtboard id="add" label="03 · Add habit" width={420} height={894}>
            {frame(AddHabit)}
          </DCArtboard>
          <DCArtboard id="detail" label="04 · Habit detail" width={420} height={894}>
            {frame(HabitDetail)}
          </DCArtboard>
          <DCArtboard id="settings" label="05 · Your space" width={420} height={894}>
            {frame(Settings)}
          </DCArtboard>
        </DCSection>

        {/* ───────────── Palette variant ───────────── */}
        <DCSection id="alt" title="Alt palette · Morning Clay" subtitle="Same system, warmer accent — terracotta primary, olive secondary">
          <DCArtboard id="alt-dashboard" label="Today · Morning Clay" width={420} height={894}>
            {frame(Dashboard, { palette: morningPalette })}
          </DCArtboard>
          <DCArtboard id="alt-detail" label="Detail · Morning Clay" width={420} height={894}>
            {frame(HabitDetail, { palette: morningPalette })}
          </DCArtboard>
          <DCArtboard id="alt-settings" label="Settings · Morning Clay" width={420} height={894}>
            {frame(Settings, { palette: morningPalette })}
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
